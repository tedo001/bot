<style>
  html, body { margin: 0; height: 100%; }

  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }

  .drive { fill: var(--drive); }
  .deep { fill: var(--ink); }
  .hazard { fill: var(--hazard); }
  .steel { fill: var(--line-strong); }
  .estop { fill: var(--estop); }
  .blk { rx: var(--radius-md); }
  .plus { stroke: var(--surface); stroke-width: 2; stroke-linecap: square; }
  .words { position: absolute; left: var(--space-5); bottom: var(--space-5); max-width: 440px; }
  .name { margin: 0; font: 700 80px/.92 var(--font-display); letter-spacing: -.01em; color: var(--ink); }
