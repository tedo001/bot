<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon — preview</title></head>
<body>
<div id="root"></div>
<script>
var V = window.VLAStudio, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', {style:{display:'grid',gridTemplateColumns:'repeat(9, 1fr)',gap:'10px 8px',padding:'16px'}},
  V.ICON_NAMES.map(function(n){ return h('div',{key:n,style:{display:'flex',flexDirection:'column',alignItems:'center',gap:4,fontSize:11,color:'var(--ink-muted)'}}, h(V.Icon,{name:n,size:20,style:{color:'var(--ink)'}}), n); })));
</script>
</body>
</html>
