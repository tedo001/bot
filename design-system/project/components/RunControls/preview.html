<!doctype html>
<html>
<head><meta charset="utf-8"><title>RunControls — preview</title></head>
<body>
<div id="root"></div>
<script>
var V = window.VLAStudio, h = React.createElement;
function Cell(p){ return h('div',{style:{display:'flex',flexDirection:'column',gap:8,width:300}}, h('div',null,h(V.StatusPill,{status:p.s})), h(V.RunControls,{status:p.s,disabledReason:p.r})); }
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{display:'grid',gridTemplateColumns:'repeat(2, 300px)',gap:'20px 48px',padding:16}},
  h(Cell,{s:'idle'}), h(Cell,{s:'running'}), h(Cell,{s:'loading'}), h(Cell,{s:'stopped', r:'Safety config changed: apply to run'})));
</script>
</body>
</html>
